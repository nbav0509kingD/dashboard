name: Update stocks
on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests && python scripts/update_stocks.py
      - run: |
          git config user.name "dashboard-bot"; git config user.email "actions@users.noreply.github.com"
          git add data.json; git diff --cached --quiet || (git commit -m "Update stock data" && git push)
